<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in HTML</title>

</head>
<h1>Form in HTML</h1>
<form action="">
    <label for="">First name:</label>
    <input type="text" minlength="5" maxlength="25" required placeholder="First Name"/>

    <label for="">Last name:</label>
    <input type="text" minlength="5" maxlength="25" required placeholder="Last Name"/>
    <br><br>
    <label for="">Age</label>
    <input type="number" placeholder="Enter Age">
    <br><br>
    <label for="">Email</label>
    <input type="email" placeholder="Enter Email">
    <br><br>
    <label for="">Date</label>
    <input type="date" placeholder="Enter Date">
    <br><br>
    <label for="">Password:</label>
    <input type="password" placeholder="Enter Password">
    <br><br>
    <p1>Enter Your Shirt Size</p1>
    <br><br>
    <input type="radio" name="Shirt size=" id="Small" />
    <label for="Small">Small</label>
    <input type="radio" name="Shirt size=" id="Medium" checked/>
    <label for="Medium">Medium</label>
    <input type="radio" name="Shirt size=" id="Large" />
    <label for="Large">Large</label>
    <br><br>
    <input type="checkbox" name="lang" id="arabic" />
    <label for="arabic">Arabic</label>
    <input type="checkbox" name="lang" id="english" />
    <label for="english">English</label>
    <input type="checkbox" name="lang" id="bengali" />
    <label for="bengali">Bengali</label>
    <br><br>
    <label for="clr">Please Select Color Of Your Shirt</label>
    <input type="color">
    <br><br>
    <label for="PaymentOptions">Please select a payment Option:</label>
    <select name="payment" id="PaymentOptions">
        <option value=""></option>
        <option value="GPay">GPay</option>
        <option value="UPI">UPI</option>
        <option value="DebitCard">DebitCard</option>
        <option value="COD">COD</option>
    </select>
    <br><br>
    <input type="reset">
    <br>
    <input type="submit">
</form>

</body>

</html>
