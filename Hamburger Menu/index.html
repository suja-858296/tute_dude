    <span class="line line2"></span>
    <span class="line line3"></span>
  </label>

  <!-- The actual menu links -->

    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</div>
  
</body>
</html>
