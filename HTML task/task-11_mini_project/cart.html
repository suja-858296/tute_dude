<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cart.css">
</head>

<body>
    <header class="header">
        <div class="left-container">
            <nav class="navbar">
                <div class="logo">
                    <span class="logo-text">Thala</span>
                    <span class="logo-num">7.</span>
                </div>
                <ul class="nav-links">
                    <li><a class="#home" href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#brand">Brands⌄</a></li>
                    <li><a href="#more">More⌄</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
        <div class="right-container">
            <div class="search">
                <span class="icon"></span><input type="search" placeholder="🔍search">
            </div>
            <div class="cart">
                <span class="cart-icon"></span><input type="text" placeholder="🛄 0">
            </div>
            <div class="profile-pic">
                <img src="./images/profilepic.jpeg" alt="pp">
            </div>
        </div>
    </header>
    <main>
        <h1 class="heading">Shopping Cart</h1>
        <div class="container-2">
            <div class="left-container-2">
                <div class="top-line">
                    <span class="product">Product</span>
                    <span class="quantity">Quantity</span>
                    <span class="price">Price</span>
                </div>
                <hr>
                <div class="first-line">
                    <span>SevenByM.S.Dhoni... </span>
                    <span>-1+</span>
                    <span>₹4,999</span>
                    <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="#ff0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-x-icon lucide-x">
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                        </svg></span>
                </div>
                <div class="second-line">
                    <span>SevenByM.S.Dhoni... </span>
                    <span>-1+</span>
                    <span>₹4,999</span>
                    <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="#ff0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-x-icon lucide-x">
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                        </svg></span>
                </div>
                <div class="third-line">
                    <span>SevenByM.S.Dhoni... </span>
                    <span>-1+</span>
                    <span>₹4,999</span>
                    <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="#ff0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-x-icon lucide-x">
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                        </svg></span>
                </div>


            </div>
            <div class="right-container-2">
                    <span class="coupon-text">Enter coupon Code</span>
                <div class="coupon-box">
                    <input type="text" placeholder="COUPON CODE">
                    <button>Apply Coupon</button>
                </div>
                <div class="sub-total">
                    <span>Sub Total</span>
                    <span>₹4,700</span>
                </div>
                <div class="taxes">
                    <span>Taxes(If Applicable)</span>
                    <span>₹199</span>
                </div>
                <div class="discount">
                    <span>Discount</span>
                    <span>₹0</span>
                </div>
                <div class="total">
                    <span>Total</span>
                    <span>₹4,999</span>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="left-footer">
            <p>
                <span class="left-arrow"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
                </span> Continue Shopping
            </p>
        </div>
        <div class="right-footer">
            <button>Pay Now ₹4,999</button>
            <div class="secure-pay-img">
                <img class="img-card" src="./images/icons8-secure-payment-48.png"alt="">
                <img class="img-razorpay" src="./images/razorpay.png" alt="">
            </div>
        </div>

    </footer>

</body>

</html>
