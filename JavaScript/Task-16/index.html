<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
       
        <header class="dashboard-header">
            <h1 class="username">Hi, Username</h1>
            <button class="login-btn">Login</button>
        </header>

       
        <div class="search-section">
            <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="studentSearch" placeholder="Search Student...">
            </div>
            <button class="search-btn" id="searchButton">Search</button>
        </div>

       
        <main class="student-grid" id="studentGrid">

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
