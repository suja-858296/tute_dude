<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Lishan Academy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8f7f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e3e1db;
            width: 100%;
            max-width: 380px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-family: 'Georgia', serif;
            color: #1a3c28;
            margin: 0 0 10px 0;
            font-size: 28px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4cbb8;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1a3c28;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1 data-en="Student Portal" data-ur="طالب علم پورٹل">Student Portal</h1>
            <p>Welcome back to Lishan Academy</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label data-en="Email Address" data-ur="ای میل ایڈریس">Email Address</label>
                <input type="email" required placeholder="scholar@example.com">
            </div>

            <div class="form-group">
                <label data-en="Password" data-ur="پاس ورڈ">Password</label>
                <input type="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" data-en="Login to Dashboard" data-ur="لاگ ان کریں">Login to Dashboard</button>
        </form>

        <a href="index.html" class="back-link">← Back to Main Page</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
